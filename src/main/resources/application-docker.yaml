spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mybooking?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: mybooking
    password: mybooking

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always
      data-locations: classpath:db/data.sql

  h2:
    console:
      enabled: false
